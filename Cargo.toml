[package]
name = "hq"
version = "0.1.0"
edition = "2021"
description = "Windows desktop gold price tracker built with GPUI"

[dependencies]
gpui-kit = "0.8.1"
ureq = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
encoding_rs = "0.8"
flowdb = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
